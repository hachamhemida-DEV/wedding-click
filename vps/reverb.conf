[program:reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/wedding-click/backend/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/reverb.log
